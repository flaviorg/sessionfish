[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sessionfish"
version = "0.1.0"
description = "Chess-engine-style game review for coding-agent sessions: an eval bar across every move, blunders marked ??, and a forked replay of a better line."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Flavio Gouveia" }]
keywords = ["langgraph", "agents", "claude-code", "code-review", "evaluation", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "langgraph>=1.2,<1.3",
  "langchain>=1.0",
  "langchain-core>=1.8",
  "langchain-anthropic>=1.7",
  "langchain-openai>=1.8",
  "pydantic>=2.14",
  "rich>=15",
  "typer>=0.29",
  "pytest>=8",
  "ruff>=0.6",
]

[project.optional-dependencies]
dev = ["pytest-cov>=5"]

[project.scripts]
sessionfish = "sessionfish.cli:app"

[project.urls]
Homepage = "https://github.com/flaviorg/sessionfish"
Repository = "https://github.com/flaviorg/sessionfish"
Issues = "https://github.com/flaviorg/sessionfish/issues"
Changelog = "https://github.com/flaviorg/sessionfish/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/sessionfish"]

[tool.hatch.build.targets.wheel.force-include]
"examples/discount_shop" = "sessionfish/_examples/discount_shop"
"examples/sessions" = "sessionfish/_examples/sessions"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "C4", "PT"]
ignore = ["S101", "S603", "S607", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011", "PT018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["sessionfish"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
