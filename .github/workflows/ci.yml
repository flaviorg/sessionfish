name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Docs and fixtures are in sync with the code
        run: |
          python scripts/gen_graph.py --check
          python scripts/make_fixture.py --check
      - name: Tests (offline, scripted model)
        run: pytest
      - name: Demo
        run: sessionfish demo --json > demo-report.json
